<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <!-- Meta básicos -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebP-FILECon</title>
  <meta name="description" content="Convert your images to WebP instantly." />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />

  <!-- 1. Tailwind v3 (genera la hoja en el cliente) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    };
  </script>

  <!-- 2. Lucide icons -->
  <script defer src="https://unpkg.com/lucide@latest"></script>

  <!-- 3. Tu CSS propio (después de Tailwind) con busteo de caché -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ ts }}" />
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- ── Theme toggle ── -->
  <button id="theme-toggle" aria-label="Toggle dark mode"
          class="fixed top-4 left-4 p-2 rounded-full bg-white/70 dark:bg-gray-800/70 shadow backdrop-blur z-50">
    <i data-lucide="moon" class="w-5 h-5"></i>
  </button>

  <main class="flex-1 flex items-center justify-center py-14">
    <div class="w-full max-w-3xl px-6">
      <h1 class="text-3xl font-extrabold mb-8 text-center tracking-tight">WebP-FILECon</h1>

      <!-- ── Toasts ── -->
      <div id="toasts" aria-live="polite" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

      <!-- ── Upload form ── -->
      <form id="upload-form" action="{{ url_for('web.convert') }}" method="post" enctype="multipart/form-data"
            class="space-y-6 bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-8">

        <!-- Drop zone -->
        <label id="drop-zone" for="input-images"
               class="flex flex-col items-center justify-center gap-2 w-full h-48 border-2 border-dashed
                      border-gray-300 dark:border-gray-600 rounded-xl cursor-pointer transition
                      hover:bg-gray-50 dark:hover:bg-gray-700">
          <!-- cloud-arrow-up icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 opacity-60" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 15a4 4 0 014-4h.1M17 11h.1a4 4 0 014 4m-8-5V3m0 0l-2.293 2.293M12 3l2.293 2.293" />
          </svg>
          <span class="text-sm font-medium">Drag & drop or click to select images</span>
          <input id="input-images" name="input_images" type="file" accept="image/*" multiple required class="hidden" />
        </label>

        <!-- Prefix -->
        <div class="flex flex-col gap-2">
          <label for="output-prefix" class="font-medium">Output image prefix</label>
          <input id="output-prefix" name="output_prefix" type="text" required placeholder="e.g. vacation"
                 class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600
                        bg-white/60 dark:bg-gray-700/60 focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>

        <button type="submit"
                class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-teal-500 to-cyan-500
                       text-white shadow-lg transition hover:shadow-xl active:scale-[0.98]">
          Convert to WebP
        </button>
      </form>

      <!-- Previews -->
      <section class="mt-10">
        <h2 class="text-lg font-bold mb-4">Preview</h2>
        <div id="preview-section"
             class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(120px,1fr))]"></div>
      </section>

      <!-- Converted -->
      <section class="mt-10">
        <h2 class="text-lg font-bold mb-4">Converted</h2>
        <div id="converted-images-section"
             class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(120px,1fr))]"></div>
      </section>
    </div>
  </main>

  <!-- ── Flash messages to JS (safe, sin comas colgantes) ── -->
  <script>
    window.flashedMessages = {{ get_flashed_messages(with_categories=true) | tojson }};
  </script>

  <!-- Main script -->
  <script src="{{ url_for('static', filename='script.js') }}?v={{ ts }}"></script>
  <script>
    // Por si el script tarda o Lucide carga después:
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
